<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b67f1"><title>페이지를 찾을 수 없어요 · DayCraft</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,'Noto Sans KR',sans-serif;background:#eef1f7;color:#20243a}.card{width:min(520px,100%);padding:34px;border-radius:26px;background:#fff;border:1px solid #dfe3ec;box-shadow:0 18px 40px #1f264212;text-align:center}.mark{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:#5b67f1;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}.card h1{margin:0;font-size:25px}.card p{color:#6f7588;line-height:1.7;font-size:14px}.actions{display:flex;justify-content:center;gap:10px;margin-top:22px}.actions button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.home{background:#5b67f1;color:#fff}.back{background:#f1f3f8;color:#20243a}
</style></head><body><main class="card"><div class="mark">?</div><h1>페이지를 찾을 수 없어요</h1><p>주소가 바뀌었거나 잘못 입력되었을 수 있어요.<br>생활계획표 편집기로 돌아가 다시 시작해보세요.</p><div class="actions"><button class="back" onclick="history.back()">이전 페이지</button><button class="home" id="homeBtn">편집기로 가기</button></div></main><script>const p=location.pathname.split('/').filter(Boolean);const base=location.hostname.endsWith('github.io')&&p.length?'/'+p[0]+'/':'/';document.getElementById('homeBtn').onclick=()=>location.href=base;</script></body></html>
